name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  image-studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # The standalone server uses node:sqlite (package.json engines >= 22.13).
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run typecheck:test
      - run: npm test
      - run: npm run build
      - run: npm run check:bundle
      - run: docker build -t image-studio:ci .
      # Same image in both modes: read-only 101:101 platform, /data-backed standalone.
      - run: scripts/smoke-image.sh image-studio:ci
